<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vstorm workload results</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"

          crossorigin="anonymous"
          defer></script>
  <script src="/dashboard-lib.js" defer></script>
  <script src="/app.js" defer></script>

<body>
  <header class="top">
    <div class="brand">
      <a class="brand-title" href="#/runs">vstorm workload results</a>
      <p class="brand-desc">
        Collect and browse batch VM create / boot / workload timings from
        <a href="https://github.com/gqlo/vstorm" target="_blank" rel="noopener noreferrer">vstorm</a>
        (spawn VMs in a batch on OpenShift Virtualization).
      </p>
    </div>
    <div class="top-actions">
      <button type="button" id="btn-refresh" class="btn">Refresh</button>
      <label class="auto">
        <input type="checkbox" id="auto-refresh" />
        Auto
      </label>
    </div>
  </header>
  <nav id="crumbs" class="crumbs" aria-label="Breadcrumb"></nav>
  <main id="app" class="app">Loading…</main>
